<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    .container {
      height: 100vh;
      position: relative;
    }
    .overlap {
      position: absolute;
      height: 20rem;
      width: 20rem;
      top: calc(50% - 10rem);
      right: calc(50% - 10rem);
      border: 3px solid black;
     
    }
    img {
      width: 100%;
      height: 100%;
    }
    .text {
      position: absolute;
      background-color: rgba(0,0,0,0.66);
      color: red;
      top: 0;
      bottom: 0;
      right: 0;
      left: 0;
      font-size: 30px;
      width: 20rem;

    }
    p{}
  </style>
  <body>
    <div class="container">
      <div class="overlap">
        <img
          src="https://live.staticflickr.com/6064/6117557491_5fd0ed244f_b.jpg"
        />
        <div class="text">
          <p>This is an image</p>
        </div>
      </div>
    </div>
  </body>
</html>
