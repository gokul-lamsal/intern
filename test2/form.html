<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../gobal.css" />
    <title>Form example</title>
  </head>
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      height: 35rem;
      border: 3px solid aqua;
      display: flex;
      justify-content: space-between;
    }
    .container > div {
      width: 100%;
      width: 22rem;
    }
    .imgContainer {
      position: relative;
    }
    img,
    .overlayText {
      position: absolute;
    }
    .imgContainer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-top-left-radius: 30px;
      border-bottom-left-radius: 30px;
    }
    .overlayText {
      margin: 1rem 6rem;
      font-size: 2rem;
    }
    .formContainer{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 1rem 0;
      gap: 0.8rem;
    }
    #register{
    padding: 0.5rem 2.5rem;
    margin-top: 0.5rem;
    border: none;
    border-radius: 8px;
    background-color: rgb(136, 155, 155);
    color: white;
    cursor: pointer;
    font-size: 1rem;
    }
    /* .formContainer > *{
      border: 1px solid red;

    } */
  </style>
  <body>
    <div class="container">
      <div class="imgContainer">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT04t0yFOJcGRqX2rsIAwKLSDhIq9zceavljWgh7t2aqiqvLHJw9tGw4SY&s=10"
          alt="Img"
        />

        <div class="overlayText">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Magni porro architecto asperiores dicta voluptates nam libero necessitatibus! Velit, minus hic.</div>
      </div>
      <div class="formContainer">
        <h2 ">Register</h2>
        <span style="font-size: 1.2rem;">Enter your Username:</span>
        <input type="text" name="username" id="username">
        <span style="font-size: 1.2rem;">Enter your Password:</span>
        <input type="text" name="Password id="Password">
        <input type="submit" name="register" id="register">
      </div>
    </div>
  </body>
</html>
