<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../gobal.css" />
    <link rel="stylesheet" href="./todo.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>TodoList</title>
  </head>
  <body>
    <div class="container">
      <div class="heading">TODO LIST</div>
      <div class="bar">
        <div class="searchBar">
          <input
            type="text"
            name="search"
            id="search"
            placeholder="Search..."
          />
          <button class="searchIcon">
            <i
              class="fa-solid fa-magnifying-glass"
              style="color: white; font-size: large"
            ></i>
          </button>
        </div>
        <button class="addBtn">Add</button>
      </div>
      <div class="todoList">
        <div class="todoItem todoItem1">
          <div class="itemInfo">
            <div class="title">" Drink Water "</div>
            <div class="description">
              <i class="fa-solid fa-arrow-right"></i>
              <span>Drink 500ml water at 2:00pm</span>
            </div>
            <div class="priority priorityHigh">
              <i class="fa-solid fa-alarm-clock"></i>
              <span>High</span>
            </div>
          </div>
          <div class="itemAction">
            <button class="deleteBtn">Delete</button>
            <button class="editBtn">Edit</button>
          </div>
        </div>

        <div class="todoItem todoItem3">1</div>
        <div class="todoItem todoItem1">2</div>
        <div class="todoItem todoItem2">3</div>
        <div class="todoItem todoItem3">4</div>
      </div>
    </div>
    <!-- overlay add form -->
    <div class="addOverlayWrapper">
      <form action="" class="addItem">
        <div class="additemInfo">
          <span>Add List</span>
          <input type="text" placeholder="Title" name="title" id="title" />
          <input
            type="text"
            placeholder="Description"
            name="description"
            id="description"
          />
          <input
            type="text"
            placeholder="Priority"
            name="priority"
            id="priority"
          />
        </div>
        <div class="additemAction">
          <button class="deleteBtn" type="reset">Reset</button>
          <button class="editBtn">Submit</button>
        </div>
        <button class="closeOverlay" type="button">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </form>
    </div>
    <script>
      const addOverlay = document.querySelector(".addOverlayWrapper");
      const addBtn = document.querySelector(".addBtn");
      const addItem = document.querySelector(".addItem");
      const closeBtn = document.querySelector(".closeOverlay");
      addBtn.addEventListener("click", () => {
        addOverlay.style.display = "flex";
      });
      closeBtn.addEventListener("click", () => {
        addOverlay.style.display = "none";
      });
      let isOpen = false;
    </script>
  </body>
</html>
