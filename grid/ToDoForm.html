<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../gobal.css" />
    <link rel="stylesheet" href="./todo.css" />
    <title>Todo form</title>
  </head>
  <body>
    <div class="addOverlayWrapper">
      <form action="" class="addItem">
        <div class="additemInfo">
          <span>Add List</span>
          <input type="text" placeholder="Title" name="title" id="title" />
          <input
            type="text"
            placeholder="Description"
            name="description"
            id="description"
          />
          <input
            type="text"
            placeholder="Priority"
            name="priority"
            id="priority"
          />
        </div>
        <div class="additemAction">
          <button class="deleteBtn" type="reset">Reset</button>
          <button class="editBtn">Submit</button>
        </div>
      </form>
    </div>
  
  </body>
</html>
