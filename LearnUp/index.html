<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../gobal.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>LearnUp</title>
  </head>
  <body>
    <nav>
      <div style="font-size: 1.5rem; flex-shrink: 0">
        <span>Learn</span> <span style="color: red">Up</span>
      </div>
      <ul class="links">
        <li>Courses</li>
        <li>Community</li>
        <li>Blog</li>
      </ul>
    </nav>
    <main>
      <!-- SideBar -->
      <div class="sideBar">
        <div class="mainMenu">
          <p>Main Menu</p>
          <ul class="mainMenuList">
            <li class="mainMenuListItems">
              <span class="mainMenuListIcon"
                ><i class="fa-regular fa-address-book"></i></span
              ><span class="mainMenuListText">Overview</span>
              <div class="dummyBgMenuItem"></div>
            </li>
            <li class="mainMenuListItems">
              <span class="mainMenuListIcon"
                ><i class="fa-solid fa-laptop"></i></span
              ><span class="mainMenuListText">My courses</span>
              <div class="dummyBgMenuItem"></div>
            </li>
            <li class="mainMenuListItems">
              <span class="mainMenuListIcon"
                ><i class="fa-solid fa-user-tie"></i></span
              ><span class="mainMenuListText">My mentors</span>
              <div class="dummyBgMenuItem"></div>
            </li>
            <li class="mainMenuListItems">
              <span class="mainMenuListIcon"
                ><i class="fa-regular fa-calendar-days"></i></span
              ><span class="mainMenuListText">Calender</span>
              <div class="dummyBgMenuItem"></div>
            </li>
          </ul>
        </div>
        <div class="mainMenu">
          <p>Account</p>
          <ul class="mainMenuList">
            <li class="mainMenuListItems">
              <span class="mainMenuListIcon"
                ><i class="fa-solid fa-gears"></i></span
              ><span class="mainMenuListText">Settings</span>
              <div class="dummyBgMenuItem"></div>
            </li>
            <li class="mainMenuListItems">
              <span class="mainMenuListIcon"
                ><i class="fa-solid fa-right-from-bracket"></i></span
              ><span class="mainMenuListText">Log out</span>
              <div class="dummyBgMenuItem"></div>
            </li>
          </ul>
        </div>
      </div>
      <div class="content">
        <div class="contentUpper">
          <div class="imgContainer">
            <img src="../dom/image/laptop.jpg" alt="" />
            <div class="imgContainerText">
                <span>Web Development</span>
            </div>
          </div>
          <div class="progressContainer"></div>
        </div>
      </div>
    </main>

    <!-- Main content -->
  </body>
</html>
